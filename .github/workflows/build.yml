name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Системные зависимости (JDK, сборка)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake autopoint gettext

      - name: Кэш Android SDK/NDK и buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Установить Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Собрать APK (debug)
        run: buildozer -v android debug

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: beeragg-apk
          path: bin/*.apk
          if-no-files-found: error
