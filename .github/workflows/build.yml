name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # Фиксируем версию: ubuntu-latest переезжает на Ubuntu 26 в октябре 2026
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Системные зависимости (JDK, сборка)
        run: |
          sudo apt-get update
          # libltdl-dev обязателен: даёт макрос LT_SYS_SYMBOL_USCORE,
          # без него autoreconf не собирает libffi, и p4a падает
          sudo apt-get install -y \
            git zip unzip patch ccache openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev bzip2 libbz2-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev autopoint gettext

      - name: Кэш Android SDK/NDK и gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Установить Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Принять лицензии Android SDK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Собрать APK (debug)
        run: buildozer android debug 2>&1 | tee buildozer-full.log

      - name: Итог сборки
        if: always()
        run: |
          echo "=== Содержимое bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ пуст — сборка не дошла до упаковки"
          echo "=== Последние 60 строк лога ==="
          tail -60 buildozer-full.log 2>/dev/null || true

      - name: Загрузить APK как артефакт
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beeragg-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Загрузить лог сборки (при ошибке)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer-full.log
          if-no-files-found: warn
