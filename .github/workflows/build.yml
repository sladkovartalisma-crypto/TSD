name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      # Готовый образ с Android SDK/NDK и buildozer —
      # не нужно скачивать и настраивать SDK в каждом запуске
      - name: Собрать APK (debug)
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Показать, что собралось
        run: |
          echo "Файлы сборки:"
          ls -la bin/ || true
          echo "Результат: ${{ steps.buildozer.outputs.filename }}"

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: beeragg-apk
          path: bin/*.apk
          if-no-files-found: error
